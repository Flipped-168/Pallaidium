name: Sync upstream
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Add upstream
        run: git remote add upstream https://github.com/tin2tin/Pallaidium.git || true
      - name: Fetch upstream
        run: git fetch upstream
      - name: Merge upstream (ours strategy)
        run: |
          git merge upstream/HEAD --no-edit -X ours || git merge FETCH_HEAD --no-edit -X ours || true
      - name: Resolve conflicts
        run: |
          for f in $(git diff --name-only --diff-filter=U); do
            if [ "$f" = ".github/workflows/sync-upstream.yml" ]; then
              git checkout --ours -- "$f" 2>/dev/null || true
              git add "$f"
            elif echo "$f" | grep -q '^\.github/workflows/'; then
              git rm -f "$f" || true
            else
              git checkout --ours -- "$f"
              git add "$f"
            fi
          done
          git commit -m "chore: resolve merge conflicts" --allow-empty || true
      - name: Preserve fork workflow
        run: |
          mkdir -p .github/workflows
          find .github/workflows -type f ! -name "sync-upstream.yml" -delete
          git add -f .github/workflows
          git commit -m "chore: preserve fork sync workflow" --allow-empty
      - name: Push
        run: git push
